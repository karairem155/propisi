# GitHub Pages yayını.
#
# main'e her push'ta derler ve yayınlar. Elle bir şey yapmaya gerek yok —
# sw.js SHELL listesi ve VERSION postbuild adımında dist'ten üretiliyor
# (tools/gen-sw-shell.mjs), yani sürüm artırmayı unutma riski yok.
#
# base: './' olduğu için alt yolda (/propisi/) sorunsuz çalışır.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
